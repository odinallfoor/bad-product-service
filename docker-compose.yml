services:
  # Servicio de base de datos Postgres
  db:
    image: postgres:14-alpine
    container_name: bad-product-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: productdb
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Servicio "app" con Maven + JDK 17,
  # lo vamos a usar para compilar y levantar Spring Boot desde dentro
  app:
    image: maven:3.8.5-openjdk-17-slim
    container_name: bad-product-app
    working_dir: /app
    depends_on:
      - db
    volumes:
      - ./:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    command: >
      sh -c "mvn clean spring-boot:run"

volumes:
  maven_cache:
