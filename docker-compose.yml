services:

  # ====== DB DEV ======
  db:
    image: postgres:14-alpine
    container_name: bad-product-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: productdb
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d productdb" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ====== DB TEST ======
  db-test:
    image: postgres:14-alpine
    container_name: bad-product-db-test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: productdb_test
    ports:
      - "5433:5432"
    restart: unless-stopped
    profiles: ["test"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d productdb_test" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servicio "app" con Maven + JDK 17,
  app:
    image: maven:3.8.5-openjdk-17-slim
    container_name: bad-product-app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    command: >
      sh -c "mvn clean spring-boot:run"

volumes:
  maven_cache:
