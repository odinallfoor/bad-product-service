spring.application.name=bad-product-service

# Postgres "de produccion" hardcodeado aca mismo.
spring.datasource.url=jdbc:postgresql://db:5432/productdb
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA relajado al maximo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Para que Hibernate no se ponga exquisito
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
